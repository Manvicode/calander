<html>
    <head>
        <title>Today Calander</title>
    </head>
    <body>
<div id="Mycalander"></div>

<hr>

<h2>My calander</h2>

        <script>
function displayDateAndDay() {
    var currentDate = new Date();
    var date = currentDate.getDate();
    var month = currentDate.getMonth() + 1;
    var year = currentDate.getFullYear();
    var dayNumber = currentDate.getDay(); 
    
    var today;
    
    switch(dayNumber) {
        case 0: today = "Sunday"; break;
        case 1: today = "Monday"; break;
        case 2: today = "Tuesday"; break;
        case 3: today = "Wednesday"; break;
        case 4: today = "Thursday"; break;
        case 5: today = "Friday"; break;
        case 6: today = "Saturday"; break;
    }
    
    var calander = "Date: " + date + "/" + month + "/" + year + " Day: " + today;
    
    document.getElementById("Mycalander").innerText = calander;
}

window.onload = displayDateAndDay;

        </script>
    </body>
</html>
